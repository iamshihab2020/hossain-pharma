# Host ports are deliberately NON-standard: 5433 and 6380.
#
# Other projects on this machine already bind the defaults (GrowthOS runs
# postgres on 5432 and redis on 6379). Claiming those would either fail to
# bind or, worse, point this project's migrations at another project's
# database. Container-internal ports stay standard, so nothing inside the
# compose network changes.
#
# Testcontainers (packages/db test suites) allocates its own random host
# port per run and is unaffected by any of this.
services:
  postgres:
    image: postgres:16-alpine
    container_name: nexmarket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexmarket
    ports:
      - '5433:5432'
    volumes:
      - nexmarket-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nexmarket']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nexmarket-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - nexmarket-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # THE TEST STACK. Behind a profile, so `docker compose up -d` for development
  # starts nothing extra. The e2e suite DROPS ITS SCHEMA on every run, which is
  # a thing you want nowhere near the database you were mid-way through
  # debugging - hence a separate pair rather than a separate schema.
  postgres-e2e:
    profiles: ['e2e']
    image: postgres:16-alpine
    container_name: nexmarket-postgres-e2e
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexmarket_e2e
    ports:
      - '5434:5432'
    # NO named volume, deliberately: this database is disposable, and a volume
    # would carry yesterday's rows into today's run.
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nexmarket_e2e']
      interval: 5s
      timeout: 5s
      retries: 10

  redis-e2e:
    profiles: ['e2e']
    image: redis:7-alpine
    container_name: nexmarket-redis-e2e
    ports:
      - '6381:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nexmarket-pgdata:
  nexmarket-redisdata:
